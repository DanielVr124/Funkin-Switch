name: Nintendo Switch Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - switch-port-dev
    paths:
      - 'source/**'
      - 'project.hxp'
      - 'hmm.json'
      - 'hmm-switch.json'
      - 'tools/patch-switch-dependencies.py'
      - 'tools/isolate-switch-sdl2.py'
      - '.github/workflows/build-switch-release.yml'
      - '.github/actions/setup-haxe/**'
      - 'assets/**'
      - 'art/**'
      - 'templates/**'

permissions:
  contents: read

concurrency:
  group: switch-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  switch:
    name: Nintendo Switch NRO release
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and assets
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select Switch dependency manifest
        run: cp hmm-switch.json hmm.json

      - name: Set up Haxe and Switch dependencies
        id: setup-haxe
        uses: ./.github/actions/setup-haxe
        with:
          haxe: '4.3.7'
          targets: switch
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Switch dependency compatibility
        run: python3 tools/patch-switch-dependencies.py

      # The pinned devkitpro container already ships these Switch portlibs.
      # Verify them locally instead of refreshing the external package mirrors,
      # which can return 403 and prevent the actual game compile from starting.
      - name: Verify Switch video libraries
        run: |
          dkp-pacman -Q \
            switch-dav1d switch-ffmpeg switch-libarchive switch-libass \
            switch-libexpat switch-libfribidi switch-libmpv switch-sdl2 switch-libplacebo \
            switch-libzstd switch-lz4

      # MPV's prebuilt port uses SDL2, while Lime uses SDL3. Their C APIs
      # export overlapping symbol names, so isolate MPV's SDL2 ABI before link.
      - name: Isolate MPV SDL2 symbols from Lime SDL3
        run: python3 tools/isolate-switch-sdl2.py

      - name: Prepare HXCPP build tools
        run: |
          HXCPP_TOOL=".haxelib/hxcpp/git/hxcpp.n"
          if [[ -s "$HXCPP_TOOL" ]]; then
            echo "Reusing cached HXCPP build tool: $HXCPP_TOOL"
          else
            cd .haxelib/hxcpp/git/tools/hxcpp
            haxe compile.hxml
            test -s ../../hxcpp.n
          fi

      # Lime's Linux host build generates SDL Wayland protocol sources.
      # Debian's libwayland-bin package provides the required wayland-scanner executable.
      - name: Install Linux Lime host build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwayland-bin libwayland-dev wayland-protocols \
            libdbus-1-dev libbsd-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxinerama-dev libxxf86vm-dev \
            libxkbcommon-dev \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libsamplerate0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libibus-1.0-dev libudev-dev fcitx-libs-dev \
            libpipewire-0.3-dev libdecor-0-dev
          command -v wayland-scanner
          test -f /usr/include/dbus-1.0/dbus/dbus.h
          test -f /usr/include/X11/Xcursor/Xcursor.h
          test -f /usr/include/wayland-util.h

      # The .haxelib dependency cache also retains Lime's compiled Linux host runtime.
      # Rebuild it only on a cold cache; apt prerequisites above are still installed on every runner.
      - name: Prepare Linux Lime host runtime
        run: |
          LIME_HOST=".haxelib/lime/git/ndll/Linux64/lime.ndll"
          if [[ -s "$LIME_HOST" ]]; then
            echo "Reusing cached Lime host runtime: $LIME_HOST"
          else
            haxelib run lime rebuild cpp -64
          fi
          test -s "$LIME_HOST"

      - name: Rebuild Lime for Nintendo Switch
        run: haxelib run lime rebuild switch
        timeout-minutes: 90

      # Save .haxelib before the much larger game compile fills the runner disk.
      # This cache includes downloaded Haxe dependencies plus the prepared HXCPP/Lime tools.
      - name: Save Haxe dependencies and prepared toolchain cache
        if: ${{ steps.setup-haxe.outputs.haxelib-cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .haxelib
          key: haxe-hmm-${{ runner.os }}-${{ hashFiles('**/hmm.json') }}

      - name: Build Friday Night Funkin' for Nintendo Switch
        run: |
          set +e
          haxelib run lime build switch -release -DGITHUB_BUILD > switch-build.log 2>&1
          build_status=$?
          if [[ "$build_status" -ne 0 ]]; then
            echo "Switch build failed (exit $build_status). Last 300 log lines:"
            tail -n 300 switch-build.log | tee switch-build-tail.log
            exit "$build_status"
          fi
          tail -n 80 switch-build.log
        timeout-minutes: 120

      - name: Add Switch build log to job summary
        if: ${{ failure() && hashFiles('switch-build-tail.log') != '' }}
        run: |
          {
            echo "## Switch build log (last 300 lines)"
            echo
            echo '```text'
            cat switch-build-tail.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload only the NRO. The user installs it by replacing their existing file.
      - name: Upload Switch NRO
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Switch-NRO-${{ github.sha }}
          path: export/release/switch/bin/Funkin.nro
          if-no-files-found: error
          retention-days: 14

