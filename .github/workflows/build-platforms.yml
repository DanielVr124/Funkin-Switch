name: Build Windows and Nintendo Switch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Haxe and Haxelib dependencies
        uses: ./.github/actions/setup-haxe
        with:
          haxe: '4.3.7'
          targets: windows
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile HXCPP build tools
        shell: bash
        run: |
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Rebuild Lime for Windows
        run: haxelib run lime rebuild windows

      - name: Build Friday Night Funkin' for Windows
        run: haxelib run lime build windows -v -release -DGITHUB_BUILD
        timeout-minutes: 120

      - name: Package Windows desktop ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'export/release/windows/bin/*' -DestinationPath 'dist/FridayNightFunkin-Windows.zip' -CompressionLevel Optimal

      - name: Upload Windows build (private repositories only)
        if: ${{ github.repository_visibility == 'private' }}
        uses: actions/upload-artifact@v4
        with:
          name: FridayNightFunkin-Windows-${{ github.sha }}
          path: dist/FridayNightFunkin-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Report artifact restriction
        if: ${{ github.repository_visibility != 'private' }}
        run: echo "Build succeeded, but binary artifacts are not uploaded from a public repository because the build contains proprietary game assets."

  switch:
    name: Nintendo Switch homebrew build
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mark checkout as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select Nintendo Switch dependency set
        run: cp hmm-switch.json hmm.json

      - name: Set up Haxe and Haxelib dependencies
        uses: ./.github/actions/setup-haxe
        with:
          haxe: '4.3.7'
          targets: switch
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Switch dependency compatibility
        run: python3 tools/patch-switch-dependencies.py

      - name: Compile HXCPP build tools
        run: |
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Rebuild Lime for Nintendo Switch
        run: haxelib run lime rebuild switch
        timeout-minutes: 90

      - name: Build Friday Night Funkin' for Nintendo Switch
        run: haxelib run lime build switch -v -release -DGITHUB_BUILD
        timeout-minutes: 120

      - name: Package Switch SD-card installation ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/sd-card/switch/Funkin-Switch/mods
          cp export/release/switch/bin/Funkin.nro dist/sd-card/switch/Funkin-Switch/Funkin.nro
          cat > dist/sd-card/README.txt <<'EOF'
          Friday Night Funkin' - Nintendo Switch homebrew

          Installation:
          1. Extract this ZIP to the root of the SD card used by your homebrew-enabled Nintendo Switch.
          2. Keep the folder structure intact.
          3. Open the Homebrew Menu and launch Funkin.nro from the switch/Funkin-Switch folder.

          Writable game data:
          - Saves: switch/Funkin-Switch/saves
          - Mods: switch/Funkin-Switch/mods
          - Crash/debug logs: switch/Funkin-Switch/logs

          This is an unofficial homebrew build. Do not redistribute the game or its bundled assets.
          EOF
          cat > dist/sd-card/switch/Funkin-Switch/mods/README.txt <<'EOF'
          Place compatible Friday Night Funkin' V-Slice mods in this folder.
          EOF
          (cd dist/sd-card && zip -qr ../FridayNightFunkin-Switch-SDCard.zip .)

      - name: Upload Switch build (private repositories only)
        if: ${{ github.repository_visibility == 'private' }}
        uses: actions/upload-artifact@v4
        with:
          name: FridayNightFunkin-Switch-${{ github.sha }}
          path: |
            export/release/switch/bin/Funkin.nro
            dist/FridayNightFunkin-Switch-SDCard.zip
          if-no-files-found: error
          retention-days: 14

      - name: Report artifact restriction
        if: ${{ github.repository_visibility != 'private' }}
        run: echo "Build succeeded, but NRO/asset artifacts are not uploaded from a public repository because they may contain proprietary game assets."
